<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Портфоліо</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <header>
            <h1>Моє Портфоліо</h1>
            <nav class="nav">
                <input type="checkbox" id="menu-toggle" class="menu-toggle">
                <label for="menu-toggle" class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Головна</a></li>
                    <li><a href="about.html" class="nav-link">Про мене</a></li>
                    <li><a href="contacts.html" class="nav-link">Контакти</a></li>
                </ul>
            </nav>
        </header>

        <aside class="sidebar">
            <h3>Меню</h3>
            <ul>
                <li><a href="#" class="nav-link">Мої навички</a></li>
                <li><a href="#" class="nav-link">Завантажити CV</a></li>
            </ul>
        </aside>

        <main class="content">
            <section class="section">
                <h2>Форма зворотного зв'язку</h2>
                <form action="#" method="post">
                    <fieldset>
                        <legend>Особисті дані</legend>
                        <label for="name">Ім'я:</label>
                        <input type="text" id="name" name="name" required>
                        
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </fieldset>
                    
                    <fieldset>
                        <legend>Повідомлення</legend>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </fieldset>

                    <button type="submit" class="button">Надіслати</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Ростислав. Всі права захищені.</p>
        </footer>
    </div>
</body>
</html>
